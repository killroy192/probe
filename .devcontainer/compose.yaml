# One service. init-env.sh (devcontainer.json's initializeCommand) writes the
# .env this reads, on the host, before every start.
name: ${PROBE_PROJECT}
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${PROBE_PROJECT}
    init: true
    # The dev runner binds loopback on purpose; the relay bridges the published
    # ports to it. Cursor's own port forwarding does not need it, the terminal does.
    command: [node, /usr/local/bin/port-relay.mjs, "${PROBE_WEB_PORT}", "${PROBE_SERVER_PORT}"]
    ports:
      - 127.0.0.1:${PROBE_WEB_PORT}:${PROBE_WEB_PORT}
      - 127.0.0.1:${PROBE_SERVER_PORT}:${PROBE_SERVER_PORT}
    environment:
      # Keep runtime state in the (gitignored) workspace .t3, matching the
      # worktree default. An explicit --home-dir still wins.
      T3CODE_HOME: /workspaces/${PROBE_NAME}/.t3
      T3CODE_PORT_OFFSET: ${PROBE_PORT_OFFSET}
      # Cursor copies your gitconfig; the terminal CLI does not.
      GIT_AUTHOR_NAME: ${PROBE_GIT_NAME}
      GIT_AUTHOR_EMAIL: ${PROBE_GIT_EMAIL}
      GIT_COMMITTER_NAME: ${PROBE_GIT_NAME}
      GIT_COMMITTER_EMAIL: ${PROBE_GIT_EMAIL}
      # Docker Desktop's forward of the host's SSH agent, so push works from the
      # terminal too.
      SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
    volumes:
      - ${PROBE_WORKSPACE}:/workspaces/${PROBE_NAME}
      # A linked worktree's history lives in the main checkout's .git. For the
      # main checkout this is its own .git again.
      - ${PROBE_GIT_SOURCE}:${PROBE_GIT_TARGET}
      # The host's config sets core.hooksPath=/dev/null; the container sees
      # git-config instead, which includes it and turns the repo's hooks back on.
      - ${PROBE_GIT_SOURCE}/config:/etc/probe/host-git-config:ro
      - ./git-config:${PROBE_GIT_TARGET}/config:ro
      - ${PROBE_GIT_SOURCE}/hooks:${PROBE_GIT_TARGET}/hooks:ro
      # The host runs init-env.sh and worktree.sh from here.
      - ${PROBE_WORKSPACE}/.devcontainer:/workspaces/${PROBE_NAME}/.devcontainer:ro
      - /run/host-services/ssh-auth.sock:/run/host-services/ssh-auth.sock
      # Root node_modules holds the whole pnpm virtual store and, being another
      # filesystem, pnpm's store too; a volume keeps it off the slow macOS bind mount.
      - node_modules:/workspaces/${PROBE_NAME}/node_modules
      # Claude Code's login, settings and sessions survive rebuilds.
      - claude:/home/vscode/.claude
      # Playwright's browser downloads survive rebuilds too.
      - playwright:/home/vscode/.cache/ms-playwright

volumes:
  node_modules:
  claude:
  playwright:
